# iterated-consensus preset: bowtie2 for mapping, ivar for consensus calling.
#
# Assumes paired-end input (reads_1/reads_2). If you also have unpaired
# reads, add `-U {reads_single:,}` to map_cmd yourself -- it's left out here
# because referencing {reads_single} when a run has no unpaired reads is an
# error.
#
# Fill in [input] below (delete whichever alternative you don't need), then:
#   iterated-consensus run --config pipelines.toml --output-dir results/
#
# Placeholders available to every command:
#   {reference}          current reference FASTA (the previous iteration's
#                         consensus, or the starting reference for iteration 0)
#   {index_prefix}        path prefix to build this mapper's index under
#   {bam}                  path this mapper should write its BAM to
#   {consensus_prefix}    path prefix for the consensus step's output
#   {threads}              from [run] threads below
#   {output_dir}           the effective output directory (--output-dir, or
#                         [run] output_dir below if that wasn't given)
#   {reads_1} / {reads_2} / {reads_single}
#       read-file lists. Expand with {reads_1}, {reads_1:,}, {prefix:reads_1},
#       {prefix:reads_1:sep}, or {cat:reads_1} (concatenate to one file) --
#       see the README for the full templating syntax.
#
# map_cmd below pipes bowtie2 into samtools sort, which run concurrently, so
# {map_threads}/{sort_threads} (custom [run] variables, see the README's
# "Threads and custom [run] variables") give each its own slice of
# {threads} rather than both claiming the full count at once.

[[mapper]]
name = "bowtie2"
index_cmd = ["bowtie2-build", "{reference}", "{index_prefix}"]
map_cmd = "bowtie2 -x {index_prefix} -1 {reads_1:,} -2 {reads_2:,} -p {map_threads} --local | samtools sort -@ {sort_threads} -o {bam}"

[mapper.tool-versions]
# Optional: recorded once per iteration and shown in index.html, flagged
# prominently if it ever changes mid-run -- see the README's "Tool versions".
# bowtie2 = "bowtie2 --version | head -n 1 | cut -f3 -d' '"

[consensus]
steps = [
    "samtools mpileup -aa -A -d 0 -Q 0 -f {reference} {bam} | ivar consensus -p {consensus_prefix} -q 20 -t 0.5 -m 10",
]
output = "{consensus_prefix}.fa"

[consensus.tool-versions]
# ivar = "ivar version | head -n 1 | cut -f3 -d' '"

[input]
# --- FASTQ start ---
# reads_1 = ["reads_R1.fastq.gz"]
# reads_2 = ["reads_R2.fastq.gz"]
# reads_single = ["reads_unpaired.fastq.gz"]      # optional -- see map_cmd note above
# reference_fasta = "starting_reference.fasta"   # a local file...
# reference_id = "NC_045512.2"                    # ...and/or a name: picks a
#   record out of a multi-sequence reference_fasta, or (with no
#   reference_fasta at all) an NCBI accession to fetch automatically.

# --- BAM start (use this instead of the FASTQ block above) ---
# bam = "input.bam"
# reference_id = "chr1"     # only needed if the BAM has more than one reference
#   (reference_fasta is also usable here, same as above, e.g. to give the
#   actual reference the BAM was aligned against)
# bam_reads = "ref"          # one of: ref, ref+unal, all

[output]
# Optional: copy the last iteration's consensus out to a location/name of
# your choosing once the run finishes, converged or not. Leave this whole
# section out if you're happy just reading iter_NNN/consensus.fasta
# directly from --output-dir.
# consensus_fasta = "{output_dir}/final_consensus.fasta"   # where to copy
#   it to -- a template, rendered with {output_dir} and every other
#   placeholder below; a relative result (e.g. leaving {output_dir}/ off) is
#   relative to the cwd, NOT --output-dir, unless you reference it yourself
# consensus_id = "my-sample-name"              # optional -- the FASTA header
#   to give it; if omitted, keeps whatever id the consensus tool itself used
# commands = ["samtools faidx {consensus_fasta}"]   # optional -- run once
#   consensus_fasta is written; also sees {consensus_id} and every other
#   placeholder available to mapper/consensus commands (e.g. {threads})

[run]
# output_dir = "results/"      # fallback for --output-dir; the CLI flag
                                # wins if both are given
threads = 4                    # or "auto" -- see the README
max_iterations = 20
convergence_identity = 100.0
convergence_streak = 1

# map_cmd above pipes two programs together, so they split {threads} rather
# than each claiming all of it -- adjust to taste, but keep the two roughly
# summing to no more than threads.
map_threads = 3
sort_threads = 1
