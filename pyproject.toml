[project]
name = "iterated-consensus"
version = "0.2.6"
description = "Iteratively build a consensus sequence from a BAM/FASTQ by remapping against each new consensus until convergence."
readme = "README.md"
authors = [
    { name = "Terry C. Jones", email = "terence.jones@charite.de" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "edlib>=1.3.9.post1",
    "pysam>=0.24.0",
    "typer>=0.27.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/VirologyCharite/iterated-consensus"
"Bug Tracker" = "https://github.com/VirologyCharite/iterated-consensus/issues"

[project.scripts]
iterated-consensus = "iterated_consensus.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nox>=2026.8.10",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's own (evolving)
# defaults.  E4/E7/E9: pycodestyle errors. F: pyflakes. I: import
# sorting.  B: flake8-bugbear. UP: pyupgrade. RUF: ruff-specific
# checks.  PLC0415/PLW1510: the two pylint checks worth having without
# the rest of PL's noisier complexity/magic-value rules.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "PLC0415", "PLW1510"]
